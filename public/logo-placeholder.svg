<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480" width="520" height="480">
  <rect width="520" height="480" fill="#ffffff"/>
  <!-- Simplified spider legs -->
  <g stroke="#1a1a1a" stroke-width="10" stroke-linecap="round" fill="none">
    <path d="M175 150 L110 90 M175 185 L95 150 M175 220 L100 215 M175 255 L110 300"/>
    <path d="M345 150 L410 90 M345 185 L425 150 M345 220 L420 215 M345 255 L410 300"/>
  </g>
  <g stroke="#d81e22" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M175 150 L110 90 M175 185 L95 150 M175 220 L100 215 M175 255 L110 300"/>
    <path d="M345 150 L410 90 M345 185 L425 150 M345 220 L420 215 M345 255 L410 300"/>
  </g>
  <!-- Body -->
  <ellipse cx="260" cy="215" rx="95" ry="115" fill="#1a1a1a"/>
  <!-- MG monogram -->
  <text x="260" y="180" font-family="Arial Black, Arial, sans-serif" font-size="72" font-weight="900" fill="#d81e22" text-anchor="middle">M</text>
  <text x="260" y="270" font-family="Arial Black, Arial, sans-serif" font-size="82" font-weight="900" fill="#d81e22" text-anchor="middle">G</text>
  <!-- Wordmark -->
  <text x="260" y="390" font-family="Arial Black, Arial, sans-serif" font-size="58" font-weight="900" fill="#c81a1e" text-anchor="middle" letter-spacing="2">MY GUYS</text>
  <g>
    <line x1="150" y1="425" x2="200" y2="425" stroke="#d81e22" stroke-width="4"/>
    <text x="260" y="435" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#1a1a1a" text-anchor="middle" letter-spacing="8">PEST CONTROL</text>
    <line x1="320" y1="425" x2="370" y2="425" stroke="#d81e22" stroke-width="4"/>
  </g>
</svg>
